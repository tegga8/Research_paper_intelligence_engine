[project]
name = "research-paper-intelligence-engine"
version = "0.1.0"
description = "FastAPI backend for AI research paper intelligence from ArXiv"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "feedparser>=6.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "networkx>=3.3",
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8",
  "umap-learn>=0.5",
  "hdbscan>=0.8",
  "bertopic>=0.16",
  "langchain>=0.2",
]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
